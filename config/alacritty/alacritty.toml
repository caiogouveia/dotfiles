[colors.cursor]
text = "#000000" # Color of the text under the cursor
cursor = "#ff0000" # Red cursor color

[cursor.style]
shape = "Beam"
blinking = "Always"

[font]
size = 12
offset.x = 0
offset.y = 0
glyph_offset.x = 0
glyph_offset.y = 0

# [font.normal]
# family = "Agave Nerd Font Mono"

[terminal]

[terminal.shell]
program = "/home/linuxbrew/.linuxbrew/bin/tmux"

[window]
blur = true
opacity = 0.80
option_as_alt = "Both"

[window.dimensions]
columns = 80
lines = 24

[font.normal]
family = "Iosevka Charon"
style = "Regular"

[font.bold]
family = "Iosevka Charon"
style = "Bold"

[font.italic]
family = "Iosevka Charon"
style = "Italic"

[font.bold_italic]
family = "Iosevka Charon"
style = "Bold Italic"
