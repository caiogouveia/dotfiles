# kanagawa (gerado a partir das cores do tema do nvim)
set -g @theme_main "#7e9cd8"
set -g @theme_bg "#16161d"
set -g @theme_surface "#2a2a37"
set -g @theme_muted "#54546d"
set -g @theme_text_light "#dcd7ba"
set -g @theme_text_dark "#16161d"
setw -g clock-mode-colour "#7e9cd8"
setw -g mode-style "fg=#{@theme_text_dark} bg=#{@theme_main} bold"
set -g pane-border-style "fg=#{@theme_muted}"
set -g pane-active-border-style "fg=#{@theme_main}"
set -g status-style "fg=#{@theme_main} bg=#{@theme_bg} bold"
set -g status-right-style "fg=#{@theme_main} bg=#{@theme_bg} bold"
setw -g window-status-current-style "fg=#{@theme_text_dark} bg=#{@theme_main} bold"
setw -g window-status-style "fg=#{@theme_main} bg=#{@theme_bg} bold"
set -g message-style "fg=#{@theme_main} bg=#{@theme_bg} bold"
