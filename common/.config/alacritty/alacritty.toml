[general]
import = [
    # Tema: segue o nvim (gerado por ~/.config/tmux/theme.sh)
    "~/.config/alacritty/current-theme.toml"
]

[colors.cursor]
text = "#000000" # Color of the text under the cursor
cursor = "#ff0000" # Red cursor color

[cursor.style]
shape = "Beam"
blinking = "Always"

[font]
size = 14
offset.x = 0
offset.y = 0
glyph_offset.x = 0
glyph_offset.y = 0

[terminal.shell]
program = "zsh"
args = ["-i", "-c", "exec tmux"]

[window]
blur = true
opacity = 0.88
option_as_alt = "Both"

[window.dimensions]
columns = 80
lines = 24

[font.normal]
family = "Agave Nerd Font"
style = "Regular"

[font.bold]
family = "Agave Nerd Font"
style = "Bold"

[font.italic]
family = "Agave Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Agave Nerd Font"
style = "Bold Italic"
